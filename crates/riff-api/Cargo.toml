[package]
name = "riff-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Riff's API layer for music providers."

[features]
# Allows RIFF_ACCEPT_INVALID_CERTS to disable certificate validation in debug
# builds. Off by default so release builds do not carry the capability.
insecure-tls = ["isahc/tls-insecure"]

[dependencies]
riff-auth = { path = "../riff-auth" }
riff-config = { path = "../riff-config" }
spotify-api = { path = "../../generated/spotify-api" }

serde_json = "1.0.96"
thiserror = "2.0.20"
async-trait = "0.1"
log = "0.4.17"
httpdate = "1.0.3"
http = "1.3"
reqwest = "0.12"
reqwest-middleware = "0.4"
glib = "0.22.9"
gdk-pixbuf = "0.22.0"
futures = "0.3.18"
uuid = { version = "1.18", features = ["v5"] }

[dependencies.serde]
version = "1.0.136"
features = ["derive"]

[dependencies.gdk]
version = "0.11.4"
package = "gdk4"

[dependencies.tokio]
version = "1"
# `rt` covers `spawn_blocking`, which keeps image decoding off the
# caller's thread.
features = ["rt", "fs", "macros", "sync", "time"]

[dependencies.isahc]
version = "2.0.1"
features = ["json"]

[dependencies.gettext-rs]
version = "=0.7.0"
features = ["gettext-system"]

[dev-dependencies.tokio]
version = "1"
# `test-util` gives the scheduler tests a paused clock, so their ordering does
# not depend on real timing.
features = ["test-util"]
