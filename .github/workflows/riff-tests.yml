name: riff-tests

# Runs the Rust unit test suite.

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    # Riff pulls in gtk4 (gnome_47 feature) and libadwaita 1.7, which require
    # glib >= 2.82. Ubuntu's apt packages lag behind (glib 2.80), so the crate
    # fails to build there. Run in a Fedora container that ships current GNOME
    # libraries, matching the blueprint-lint job in riff-quality.yml.
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: >-
          dnf install -y
          gcc pkgconf-pkg-config gtk4-devel libadwaita-devel glib2-devel
          openssl-devel alsa-lib-devel pulseaudio-libs-devel
          gstreamer1-devel gstreamer1-plugins-base-devel
          gettext libcurl-devel blueprint-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # config.rs is generated by meson at build time; write a placeholder with
      # the constants main.rs and about.rs reference so the crate compiles for
      # the test run.
      - name: Add placeholder config.rs
        run: |
          cat > src/config.rs <<'EOF'
          pub static PKGDATADIR: &str = "/app/share/riff";
          pub static VERSION: &str = "0.0.0-ci";
          pub static LOCALEDIR: &str = "/app/share/locale";
          pub static APPID: &str = "dev.diegovsky.Riff.Devel";
          EOF

      - name: Run tests
        run: cargo test --workspace
