name: riff-quality

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  rustfmt:
    name: "Rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # config.rs is generated by meson at build time; create an empty
      # placeholder so the crate parses for a format-only check.
      - name: Add empty config.rs
        run: echo > src/config.rs

      - name: Check formatting
        run: cargo fmt --all -- --check

  blueprint-lint:
    name: "Blueprint Lint"
    runs-on: ubuntu-latest
    # Ubuntu's apt libadwaita typelib lags behind; run in a Fedora container
    # that ships libadwaita 1.7 so blueprints using Adw 1.7 widgets (e.g.
    # Adw.WrapBox) validate against the version the app actually builds against.
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: dnf install -y blueprint-compiler gtk4-devel libadwaita-devel libxml2 python3

      - name: Run blueprint lint
        run: ./scripts/lint-blueprints.sh

  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get -y update && sudo apt-get -y install shellcheck

      - name: Run shellcheck
        run: find "$GITHUB_WORKSPACE" -type f -name "*.sh" -print0 | xargs -0 shellcheck
