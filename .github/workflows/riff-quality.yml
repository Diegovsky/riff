name: riff-quality

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  rustfmt:
    name: "Rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # config.rs is generated by meson at build time; create an empty
      # placeholder so the crate parses for a format-only check.
      - name: Add empty config.rs
        run: echo > src/config.rs

      - name: Check formatting
        run: cargo fmt --all -- --check

  blueprint-lint:
    name: "Blueprint Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get -y update && sudo apt-get -y install blueprint-compiler libxml2-utils python3 gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Run blueprint lint
        run: ./scripts/lint-blueprints.sh

  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get -y update && sudo apt-get -y install shellcheck

      - name: Run shellcheck
        run: find "$GITHUB_WORKSPACE" -type f -name "*.sh" -print0 | xargs -0 shellcheck
