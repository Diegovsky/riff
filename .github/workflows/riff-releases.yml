name: riff-releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-spotify-api-crate:
    name: "Generate Spotify API crate"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Spotify API crate
        run: ./scripts/generate-spotify-api.sh

      - name: Upload generated crate
        uses: actions/upload-artifact@v4
        with:
          name: spotify-api-crate
          path: generated/spotify-api
          include-hidden-files: true
          retention-days: 1

  flatpak:
    name: "Flatpak ${{ matrix.variant.arch }}"
    needs: [generate-spotify-api-crate]
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download generated Spotify API crate
        uses: actions/download-artifact@v4
        with:
          name: spotify-api-crate
          path: generated/spotify-api

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: riff-${{ matrix.variant.arch }}.flatpak
          manifest-path: flatpak/dev.diegovsky.Riff.json
          cache-key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}

  release:
    name: "Create Release"
    needs: [flatpak]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -name "*.flatpak" | while read file; do
            cp "$file" release-files/
          done
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Riff Release #${{ github.run_number }}"
          body: |
            Weekly release build from ${{ github.ref_name }} branch

            ## Downloads
            - `riff-x86_64.flatpak` - x86_64 build
            - `riff-aarch64.flatpak` - ARM64 build (postmarketOS, PinePhone, etc.)
          generate_release_notes: true
          files: release-files/*.flatpak
          make_latest: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
